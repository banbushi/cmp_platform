version: "2.4"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-BVPVewseB8F4kWk}"
      MYSQL_DATABASE: cloud_cmp
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9001}:9001"
    volumes:
      - uploads_data:/app/public/uploads
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-BVPVewseB8F4kWk}"
      DB_NAME: cloud_cmp
      JWT_SECRET: "${JWT_SECRET:-cloud-iam-dev-secret-x9k2m7}"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
